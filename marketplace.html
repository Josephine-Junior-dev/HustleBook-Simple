<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>HustleBook Paint Marketplace</title><style>
:root{--navy:#102a56;--blue:#2463eb;--ink:#17233b;--muted:#718096;--line:#e8edf4;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui;color:var(--ink)}header{background:var(--navy);color:white;padding:23px 17px;border-radius:0 0 23px 23px}main{max-width:750px;margin:auto;padding:16px}.brand{font-size:22px;font-weight:850}.muted{color:var(--muted);font-size:12px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px}.card h3{margin:3px 0 6px}.price{font-size:20px;font-weight:850;color:var(--blue)}button,input,textarea{font:inherit}button{cursor:pointer}.primary{background:var(--blue);color:white;border:0;border-radius:10px;padding:10px 12px;font-weight:750}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.form{display:none;margin-top:12px}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#17233b;color:white;padding:12px;border-radius:10px}</style></head><body><header><div class="brand">HustleBook Paint Marketplace</div><p>Find paints, colours and supplies from participating shops.</p><a href="paint-shop.html" style="color:#fff">Shop owner? Manage your shop →</a></header><main><input id="search" class="search" placeholder="Search paint, brand, colour or shop"><div id="results" class="grid"><div class="empty">Loading products…</div></div><div id="enquiry" class="card form"><h2>Ask about this product</h2><p id="selectedProduct" class="muted"></p><form id="enquiryForm"><input id="shopId" type="hidden"><input id="productId" type="hidden"><div class="field"><label>Your name *</label><input id="customerName" required></div><div class="field"><label>Phone / WhatsApp</label><input id="customerPhone" type="tel"></div><div class="field"><label>Quantity wanted</label><input id="quantity" type="number" min="0.001" step="0.001" value="1"></div><div class="field"><label>Message</label><textarea id="message" rows="2" placeholder="Please confirm availability and delivery."></textarea></div><button class="primary">Send enquiry</button></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="marketplace.js" defer></script></body></html>
