<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>Paint Shop Marketplace</title><style>
:root{--navy:#102a56;--blue:#2563eb;--ink:#18253e;--muted:#748198;--line:#e6ebf2;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.hero{background:var(--navy);color:white;padding:25px max(18px,calc((100% - 1100px)/2)) 34px}.brand{font-size:20px;font-weight:850}.hero h1{font-size:32px;line-height:1.1;margin:30px 0 8px}.hero p{color:#d4e0f3;max-width:600px}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px;font:inherit;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.painticon{width:48px;height:48px;border-radius:13px;background:#eaf1ff;display:grid;place-items:center;font-size:25px}.muted{color:var(--muted);font-size:12px}.card h2{font-size:18px;margin:13px 0 4px}.price{font-size:22px;font-weight:850;margin:13px 0 6px}.btn{display:inline-block;background:var(--blue);color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:750;text-decoration:none}.empty{padding:45px 10px;text-align:center;color:var(--muted);background:white;border-radius:15px}.toplink{float:right;color:#d4e0f3;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:26px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.hero h1{margin-top:22px}}</style></head><body><header class="hero"><a class="toplink" href="index.html">Shop owner sign in ↗</a><div class="brand">🎨 Paint Shop Marketplace</div><h1>Find the right paint for your project.</h1><p>Browse paint colours, brands, sizes and supplies from participating local shops. Contact the shop directly to check availability.</p></header><main class="wrap"><input id="search" class="search" placeholder="Search paint, brand, colour or shop…"><div id="results" class="grid"><div class="empty">Loading catalogue…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="marketplace.js" defer></script></body></html>
